networks:
  adaptlearn-net:
    driver: bridge

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: adaptlearn
      POSTGRES_PASSWORD: adaptlearn
      POSTGRES_DB: adaptlearn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - adaptlearn-net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptlearn"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    networks:
      - adaptlearn-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mqtt:
    image: eclipse-mosquitto
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - adaptlearn-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h localhost -t test -m ping 2>/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adaptlearn:adaptlearn@db:5432/adaptlearn
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      PYTHONUNBUFFERED: "1"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    networks:
      - adaptlearn-net
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - lesson_videos:/app/videos
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  robot-mock:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
    depends_on:
      mqtt:
        condition: service_started
    networks:
      - adaptlearn-net
    command: python -m robot_mock.simulator

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000

      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/public:/app/public
    networks:
      - adaptlearn-net
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  lesson_videos:
